<script>
(() => {
  const padding = 24;

  function cropMermaid(svg) {
    const root = svg.querySelector(":scope > g, g.root");
    if (!root) return;

    let box;
    try {
      box = root.getBBox();
    } catch (_) {
      return;
    }

    if (!box.width || !box.height) return;

    svg.setAttribute(
      "viewBox",
      `${box.x - padding} ${box.y - padding} ${box.width + 2 * padding} ${box.height + 2 * padding}`
    );
    svg.setAttribute("width", "100%");
    svg.removeAttribute("height");
    svg.style.width = "100%";
    svg.style.height = "auto";
    svg.style.maxWidth = "100%";
    svg.style.display = "block";
    svg.style.marginInline = "auto";
    svg.dataset.cropped = "true";
  }

  function cropAllMermaid() {
    document
      .querySelectorAll("svg.mermaid-js:not([data-cropped])")
      .forEach(cropMermaid);
  }

  const observer = new MutationObserver(cropAllMermaid);
  observer.observe(document.documentElement, { childList: true, subtree: true });

  window.addEventListener("load", () => {
    cropAllMermaid();
    window.setTimeout(cropAllMermaid, 250);
    window.setTimeout(cropAllMermaid, 1000);
  });
})();
</script>
