lang: en
bibliography: references.bib
link-citations: true
number-sections: true
callout-appearance: simple
fig-cap-location: bottom
tbl-cap-location: top
code-overflow: wrap
crossref:
  fig-title: "Figure"
  tbl-title: "Table"

format:
  html:
    theme:
      - cosmo
      - notes.scss
    toc: true
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    anchor-sections: true

  pdf:
    documentclass: scrartcl
    pdf-engine: lualatex
    papersize: a4
    fontsize: 10.5pt
    toc: true
    toc-depth: 3
    colorlinks: true
    fig-pos: H
    linkcolor: UaeNavy
    urlcolor: UaeBlue
    citecolor: UaeTeal
    mainfont: "Noto Serif"
    sansfont: "Noto Sans"
    monofont: "JetBrains Mono"
    geometry:
      - top=25mm
      - bottom=27mm
      - left=25mm
      - right=25mm
      - headsep=8mm
    include-in-header:
      - notes-preamble.tex
    keep-tex: true
