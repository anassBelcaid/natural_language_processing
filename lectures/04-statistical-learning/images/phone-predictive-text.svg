<svg xmlns="http://www.w3.org/2000/svg" width="620" height="760" viewBox="0 0 620 760" role="img" aria-labelledby="title desc">
  <title id="title">Phone predictive text</title>
  <desc id="desc">A phone message says the students opened their, with books, laptops, and exams suggested as next words above the keyboard.</desc>
  <rect x="78" y="18" width="464" height="724" rx="54" fill="#17364a"/>
  <rect x="94" y="38" width="432" height="682" rx="40" fill="#f7f8f8"/>
  <rect x="245" y="53" width="130" height="22" rx="11" fill="#17364a"/>
  <text x="310" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="24" fill="#17364a">New message</text>
  <rect x="124" y="155" width="370" height="128" rx="25" fill="#dceeed"/>
  <text x="151" y="202" font-family="Arial,sans-serif" font-size="25" fill="#17364a">The students opened</text>
  <text x="151" y="239" font-family="Arial,sans-serif" font-size="25" fill="#17364a">their <tspan fill="#16828a">|</tspan></text>
  <g font-family="Arial,sans-serif" font-size="21" text-anchor="middle">
    <rect x="111" y="318" width="122" height="54" rx="12" fill="#fff" stroke="#16828a" stroke-width="3"/><text x="172" y="352" fill="#17364a">books</text>
    <rect x="249" y="318" width="122" height="54" rx="12" fill="#fff" stroke="#d9a62e" stroke-width="3"/><text x="310" y="352" fill="#17364a">laptops</text>
    <rect x="387" y="318" width="122" height="54" rx="12" fill="#fff" stroke="#e46850" stroke-width="3"/><text x="448" y="352" fill="#17364a">exams</text>
  </g>
  <rect x="108" y="397" width="404" height="278" rx="18" fill="#e4e8ea"/>
  <g font-family="Arial,sans-serif" font-size="20" fill="#17364a" text-anchor="middle">
    <g><rect x="119" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="136" y="442">Q</text><rect x="158" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="175" y="442">W</text><rect x="197" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="214" y="442">E</text><rect x="236" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="253" y="442">R</text><rect x="275" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="292" y="442">T</text><rect x="314" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="331" y="442">Y</text><rect x="353" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="370" y="442">U</text><rect x="392" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="409" y="442">I</text><rect x="431" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="448" y="442">O</text><rect x="470" y="411" width="34" height="48" rx="7" fill="#fff"/><text x="487" y="442">P</text></g>
    <g><rect x="139" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="156" y="501">A</text><rect x="178" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="195" y="501">S</text><rect x="217" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="234" y="501">D</text><rect x="256" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="273" y="501">F</text><rect x="295" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="312" y="501">G</text><rect x="334" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="351" y="501">H</text><rect x="373" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="390" y="501">J</text><rect x="412" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="429" y="501">K</text><rect x="451" y="470" width="34" height="48" rx="7" fill="#fff"/><text x="468" y="501">L</text></g>
    <rect x="170" y="588" width="280" height="50" rx="10" fill="#fff"/><text x="310" y="620" fill="#65757e">space</text>
  </g>
  <text x="310" y="704" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#65757e">Simplified educational reconstruction</text>
</svg>
